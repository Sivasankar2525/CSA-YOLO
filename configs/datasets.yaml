# Dataset registry: every raw source, its format, layout, and semantics.
# scripts/audit_dataset.py reads this — dataset paths never live in code.

datasets:
  SHWD:
    format: voc
    annotations_dir: datasets/raw/SHWD/VOC2028/Annotations
    images_dir: datasets/raw/SHWD/VOC2028/JPEGImages
    source_url: https://github.com/njvisionpower/Safety-Helmet-Wearing-Dataset
    license: "MIT (per repository); verify before redistribution"
    citation: "njvisionpower, Safety-Helmet-Wearing-Dataset, GitHub, 2019"
    semantics_warning: >
      Boxes are HEAD regions, not full bodies: 'hat' = head wearing helmet,
      'person' = bare head (from SCUT-HEAD). The 'person' class here must NOT
      be mapped to the full-body person class used by CSA-YOLO.

  CHV:
    format: yolo
    labels_dir: datasets/raw/CHV/CHV_dataset/annotations
    images_dir: datasets/raw/CHV/CHV_dataset/images
    splits_dir: datasets/raw/CHV/CHV_dataset/data split
    class_names: [person, vest, helmet_blue, helmet_red, helmet_white, helmet_yellow]
    source_url: https://github.com/ZijianWang-ZW/PPE_detection
    license: "Open for free use (authors); cite Wang et al., Sensors 21(10):3478, 2021"
    citation: "Wang et al., 'Fast Personal Protective Equipment Detection for Real
      Construction Sites Using Deep Learning Approaches', Sensors, 2021"
    semantics_warning: >
      Class ids verified against the authors' published class-distribution figure
      (rank-order match: 0=person, 1=vest, 2..5=helmet colors alphabetical).
      Official train/valid/test split files ship with the dataset — reuse them.
