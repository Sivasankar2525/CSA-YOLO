# CSA-YOLO default pipeline configuration.
# Every script reads paths and hyperparameters from here — nothing is hardcoded.

seed: 42

paths:
  weights_dir: weights
  results_dir: results
  datasets_dir: datasets

detector:
  # Week 1 verification uses a stock COCO-pretrained model; replaced by the
  # fine-tuned ICSD-YOLO checkpoint in Phase 2 (see docs/adr/0001-backbone-strategy.md).
  model: yolo11n.pt
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: auto          # auto → mps on Apple Silicon, cuda if available, else cpu
  image_size: 640

logging:
  level: INFO

# ---------------------------------------------------------------------------
# Module parameters. These mirror csa_yolo/pipeline.py DEFAULT_SETTINGS; a test
# checks that both stay equal. Values marked PROVISIONAL are engineering defaults,
# NOT tuned or validated. Set them on a validation split before reporting results.
# See docs/MODULES.md for the meaning of each parameter.
# ---------------------------------------------------------------------------

association:           # WPAM spatial gate + one-to-one assignment
  gate_margin_ratio: 0.10   # PROVISIONAL: margin around body region, fraction of worker height

tracking:              # IoU tracker lifecycle
  iou_threshold: 0.3
  max_age: 30          # frames without a match before a track is removed

temporal:              # TSMM per-worker evidence window
  window_size: 5
  presence_confidence: 0.5   # PPE detection confidence counted as "present"

compliance:            # SCRM decision rules
  required_ppe: [helmet, vest]
  present_threshold: 0.7     # present ratio for PRESENT (positive evidence)
  absent_threshold: 0.3      # present ratio for ABSENT (evidence of absence)
  min_evidence_frames: 5     # observations needed before a class is decided
